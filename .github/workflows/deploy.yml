name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'incoming/*.json'
      - 'incoming/**/*.json'
  workflow_run:
    workflows:
      - Ingest Uploaded Profiles
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out site source
        uses: actions/checkout@v6

      - name: Disable legal content by default
        shell: bash
        run: echo "LEGAL_CONTENT_DIR=" >> "$GITHUB_ENV"

      - name: Verify official legal-content configuration
        if: github.repository_owner == 'modsmthng'
        shell: bash
        env:
          LEGAL_CONTENT_REPOSITORY: ${{ vars.LEGAL_CONTENT_REPOSITORY }}
          LEGAL_CONTENT_PATH: ${{ vars.LEGAL_CONTENT_PATH }}
          LEGAL_CONTENT_SSH_KEY: ${{ secrets.LEGAL_CONTENT_SSH_KEY }}
        run: |
          if [[ -z "$LEGAL_CONTENT_REPOSITORY" ||
                -z "$LEGAL_CONTENT_PATH" ||
                -z "$LEGAL_CONTENT_SSH_KEY" ]]; then
            echo "Official Pages deployments require private legal content."
            exit 1
          fi

      - name: Check out private legal content
        if: github.repository_owner == 'modsmthng'
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.LEGAL_CONTENT_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.LEGAL_CONTENT_SSH_KEY }}
          path: .legal-content
          persist-credentials: false

      - name: Enable legal content for the official deployment
        if: github.repository_owner == 'modsmthng'
        shell: bash
        env:
          LEGAL_CONTENT_PATH: ${{ vars.LEGAL_CONTENT_PATH }}
        run: echo "LEGAL_CONTENT_DIR=$GITHUB_WORKSPACE/.legal-content/$LEGAL_CONTENT_PATH" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
